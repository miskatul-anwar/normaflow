[package]
name = "normaflow"
version = "3.0.0"
description = "NormaFlow — turn raw CSVs into normalized database schemas"
authors = ["Miskatul Anwar <miskatul.anwar.csecu@gmail.com>"]
license = "MIT"
repository = "https://github.com/miskatul-anwar/normaflow"
edition = "2021"
rust-version = "1.77"

[lib]
name = "normaflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
