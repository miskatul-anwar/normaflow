[package]
name = "normaflow"
version = "2.6.0"
description = "NormaFlow — turn raw CSVs into normalized database schemas"
authors = ["Miskatul Anwar <miskatul.anwar.csecu@gmail.com>"]
license = "MIT"
repository = "https://github.com/miskatul-anwar/normaflow"
edition = "2021"
rust-version = "1.77"

[lib]
name = "normaflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"], default-features = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
csv = "1.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
